# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# Template: build-aux/winget/render.sh fills in @VERSION@, @SHA256@ and
# @RELEASE_DATE@. The installer is per-user (Inno Setup, PrivilegesRequired
# lowest): it never asks for administrator rights.
PackageIdentifier: jm2.Switchworks
PackageVersion: "@VERSION@"
InstallerLocale: en-US
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ProductCode: "{0405C893-111E-5752-8C84-4CF4FD2637A3}_is1"
ReleaseDate: "@RELEASE_DATE@"
Commands:
  - swk
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/jm2/switchworks/releases/download/v@VERSION@/switchworks-windows-x86_64-setup.exe
    InstallerSha256: "@SHA256@"
ManifestType: installer
ManifestVersion: 1.6.0
