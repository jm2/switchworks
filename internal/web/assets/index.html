<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141517">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Switchworks</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preload" href="/static/fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/markdown-it.min.js" defer></script>
<script src="/static/vendor/markdown-it-emoji.min.js" defer></script>
<script src="/static/vendor/markdown-it-footnote.min.js" defer></script>
<script src="/static/vendor/purify.min.js" defer></script>
<script src="/static/vendor/highlight.min.js" defer></script>
<script src="/static/vendor/katex.min.js" defer></script>
<script src="/static/markdown.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<aside id="side" class="side" aria-label="Navigation">
  <div class="side-head">
    <a class="brand" href="#/"><img src="/static/icon.svg" alt="" width="22" height="22">Switchworks</a>
    <button id="side-close" class="icon-btn only-narrow" type="button" aria-label="Close menu"></button>
  </div>
  <a class="new-btn" href="#/spawn" id="side-new"></a>
  <nav class="side-nav">
    <a href="#/inbox" data-tab="inbox" id="nav-inbox"></a>
    <a href="#/traffic" data-tab="traffic" id="nav-traffic"></a>
    <a href="#/usage" data-tab="usage" id="nav-usage"></a>
  </nav>
  <div class="side-label">Hosts</div>
  <div id="side-tree" class="tree"></div>
  <div class="side-foot">
    <div id="side-picker"></div>
    <button id="settings" class="side-row" type="button" aria-haspopup="true"></button>
  </div>
  <div id="side-resize" class="side-resize only-wide" role="separator" aria-orientation="vertical"
       aria-label="Sidebar width" tabindex="0" title="Drag to resize; double-click to reset"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>
<div class="shell">
  <header id="top" class="top"></header>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<div id="menu" class="menu" role="menu" hidden></div>
</body>
</html>
