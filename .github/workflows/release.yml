name: Release
# Every action is pinned to a full commit SHA; Dependabot keeps the pins and
# their version comments current. Build jobs get a read-only token; only the
# attest job can mint an OIDC token, and only the publish job, which runs no
# project code, can write.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Tests the tagged source, builds every binary once, and packages the plain
  # archives and the .deb files from them.
  build:
    name: Build binaries, archives and .deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag
        id: version
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::release tags must be v-prefixed semantic versions; got $GITHUB_REF_NAME"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          core=${version%%-*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$core.0" >> "$GITHUB_OUTPUT"
      # The release notes are the changelog section for this exact version,
      # so they are reviewed in the tagged source, not typed later.
      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)",
              text,
              re.M | re.S,
          )
          if section is None:
              sys.exit(f"CHANGELOG.md has no '## [{version}]' section")
          body = section.group(1).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for {version} is empty")
          Path("notes").mkdir()
          Path("notes/RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY
      - name: Test tagged source
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build every release target
        run: make cross VERSION="$GITHUB_REF_NAME"
      - name: Check the version is stamped into the binaries
        run: |
          for b in dist/swk-linux-amd64 dist/swk-tray-linux-amd64; do
            out=$("$b" version)
            echo "$out"
            case "$out" in
              "swk $GITHUB_REF_NAME "*|"swk-tray $GITHUB_REF_NAME "*) ;;
              *) echo "::error::version was not stamped by -ldflags -X"; exit 1 ;;
            esac
          done
      - name: Package archives
        run: |
          set -euo pipefail
          mkdir -p release
          for target in linux-amd64 linux-arm64 darwin-arm64 windows-amd64; do
            name="swk-${GITHUB_REF_NAME}-${target}"
            stage="stage/$name"
            mkdir -p "$stage"
            case "$target" in
              windows-*)
                cp "dist/swk-$target.exe" "$stage/swk.exe"
                cp "dist/swkw-$target.exe" "$stage/swkw.exe"
                cp "dist/swk-tray-$target.exe" "$stage/swk-tray.exe"
                ;;
              linux-*)
                cp "dist/swk-$target" "$stage/swk"
                cp "dist/swk-tray-$target" "$stage/swk-tray"
                ;;
              *) cp "dist/swk-$target" "$stage/swk" ;;
            esac
            cp LICENSE README.md "$stage/"
            case "$target" in
              windows-*) (cd stage && zip -qr "../release/$name.zip" "$name") ;;
              *) tar -C stage --owner=0 --group=0 --numeric-owner -czf "release/$name.tar.gz" "$name" ;;
            esac
          done
      - name: Add the coordinator's Quadlet unit
        run: cp build-aux/container/switchworks-coordinator.container release/
      - name: Build .deb packages
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            make deb ARCH="$arch" VERSION="$GITHUB_REF_NAME"
            cp "dist/switchworks-$arch.deb" release/
          done
      - name: Stage binaries for the installer and app jobs
        run: |
          set -euo pipefail
          mkdir -p bin/windows-amd64 bin/darwin-arm64
          cp dist/swk-windows-amd64.exe bin/windows-amd64/swk.exe
          cp dist/swkw-windows-amd64.exe bin/windows-amd64/swkw.exe
          cp dist/swk-tray-windows-amd64.exe bin/windows-amd64/swk-tray.exe
          cp dist/swk-darwin-arm64 bin/darwin-arm64/swk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/RELEASE_NOTES.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-amd64
          path: bin/windows-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-darwin-arm64
          path: bin/darwin-arm64/
          if-no-files-found: error

  # The same spec COPR builds, from the tagged source, on Fedora.
  rpm:
    name: RPM (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: fedora:44
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False git-core golang make rpm-build systemd-rpm-macros desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the .rpm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmver=${VERSION//-/\~}
          top="$PWD/rpmbuild"
          mkdir -p "$top/SOURCES" "$top/SPECS"
          git archive --format=tar.gz --prefix="switchworks-$rpmver/" -o "$top/SOURCES/v$rpmver.tar.gz" HEAD
          sed "s/^Version:.*/Version:        $rpmver/" build-aux/rpm/switchworks.spec > "$top/SPECS/switchworks.spec"
          # swk_tag stamps the binaries with the real tag (v0.2.0-rc.1, not v0.2.0~rc.1).
          rpmbuild --define "_topdir $top" --define "swk_tag $GITHUB_REF_NAME" -bb "$top/SPECS/switchworks.spec"
          mkdir -p out
          cp "$top"/RPMS/*/switchworks-*.rpm "out/switchworks-$ARCH.rpm"
          rpm -qip "out/switchworks-$ARCH.rpm"
          rpm -qlp "out/switchworks-$ARCH.rpm"
          # The scripts create the account and handle the system unit, and
          # enable nothing for users.
          rpm -qp --scripts "out/switchworks-$ARCH.rpm" | tee scripts.txt
          grep -q 'systemd-sysusers' scripts.txt
          if grep -q 'user-units\|preset-user' scripts.txt; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          path: out/switchworks-${{ matrix.arch }}.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux package (x86_64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root.
          useradd -m builder
          cp -r . /home/builder/switchworks
          cp build-aux/arch/PKGBUILD /home/builder/switchworks/PKGBUILD
          chown -R builder:builder /home/builder/switchworks
          su builder -c "cd /home/builder/switchworks && SWK_VERSION='$GITHUB_REF_NAME' makepkg -f --noconfirm"
          pkg=$(su builder -c "cd /home/builder/switchworks && SWK_VERSION='$GITHUB_REF_NAME' makepkg --packagelist")
          if [[ -z "$pkg" || "$pkg" == *$'\n'* || ! -f "$pkg" ]]; then
            echo "Expected exactly one built package; makepkg lists: $pkg" >&2
            exit 1
          fi
          mkdir -p out
          cp "$pkg" out/switchworks-x86_64.pkg.tar.zst
          bsdtar -tf out/switchworks-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64
          path: out/switchworks-x86_64.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows installer (x86_64)
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-windows-amd64
          path: dist/windows-amd64
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The runner image preinstalls Inno Setup. An explicit version replaces
          # an older preinstalled release, and --allow-downgrade a newer one.
          choco install innosetup --version 6.7.1 --allow-downgrade -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NUMERIC: ${{ needs.build.outputs.numeric }}
        run: |
          iscc /Qp "/DAppVersion=$env:VERSION" "/DAppNumericVersion=$env:NUMERIC" `
            "/DSourceDir=$PWD\dist\windows-amd64" "/DOutputDir=$PWD\out" build-aux\inno\switchworks.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, check and uninstall it (per user, no elevation)
        shell: pwsh
        run: |
          $setup = Start-Process out\switchworks-windows-x86_64-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=addtopath', '/ALLOWELEVATED=1'
          if ($setup.ExitCode -ne 0) { throw "setup exited $($setup.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Switchworks'
          foreach ($f in 'swk.exe', 'swkw.exe', 'swk-tray.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "$f was not installed in $app" }
          }
          & (Join-Path $app 'swk.exe') version
          $un = Start-Process (Join-Path $app 'unins000.exe') -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($un.ExitCode -ne 0) { throw "uninstall exited $($un.ExitCode)" }
      - name: Render winget manifests
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha=$(sha256sum out/switchworks-windows-x86_64-setup.exe | cut -d' ' -f1)
          build-aux/winget/render.sh "$VERSION" "$sha" winget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: out/switchworks-windows-x86_64-setup.exe
          if-no-files-found: error
      # Not a release asset: submit these to microsoft/winget-pkgs by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget/
          if-no-files-found: error

  macos:
    name: macOS app and .dmg (aarch64)
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-darwin-arm64
          path: dist/darwin-arm64
      - name: Build Switchworks.app and the .dmg
        run: |
          chmod +x dist/darwin-arm64/swk
          bash build-aux/macos/build-dmg.sh "$GITHUB_REF_NAME" dist/darwin-arm64/swk out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-aarch64
          path: out/switchworks-macos-aarch64.dmg
          if-no-files-found: error

  checksums:
    name: SHA256 checksums
    needs: [build, rpm, arch, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Every artifact, each in its own folder; only the expected release
      # assets are copied out of them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect the assets and write SHA256SUMS.txt
        run: |
          set -euo pipefail
          expected=(
            "swk-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
            "swk-${GITHUB_REF_NAME}-linux-arm64.tar.gz"
            "swk-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
            "swk-${GITHUB_REF_NAME}-windows-amd64.zip"
            switchworks-amd64.deb
            switchworks-arm64.deb
            switchworks-x86_64.rpm
            switchworks-aarch64.rpm
            switchworks-x86_64.pkg.tar.zst
            switchworks-windows-x86_64-setup.exe
            switchworks-macos-aarch64.dmg
            switchworks-coordinator.container
          )
          mkdir release
          for f in "${expected[@]}"; do
            mapfile -t found < <(find artifacts -type f -name "$f")
            if (( ${#found[@]} != 1 )); then
              echo "::error::expected one $f among the build artifacts, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" release/
          done
          cd release
          sha256sum -- "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # The coordinator's image, from the same Linux binaries as the archives,
  # pushed only once every package has built. It runs nothing at build time,
  # so both architectures build without emulation.
  container:
    name: Coordinator image (GHCR)
    needs: [build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: artifacts
      - name: Stage the Linux binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            tar -xzf "artifacts/swk-${GITHUB_REF_NAME}-linux-$arch.tar.gz" -C artifacts
            cp "artifacts/swk-${GITHUB_REF_NAME}-linux-$arch/swk" "dist/swk-linux-$arch"
          done
      - name: Build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/switchworks-coordinator"
          tags=(-t "$image:$VERSION")
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name swk >/dev/null
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f build-aux/container/Containerfile --build-arg VERSION="$VERSION" \
            "${tags[@]}" --provenance=false --push --metadata-file meta.json .
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Attestations need a public repository (or GitHub Enterprise Cloud), so
  # this job is skipped while the repository is private.
  attest:
    name: Attest build provenance
    needs: checksums
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

  # The only job with a write token for the repository. It creates a draft,
  # so nothing is public until a maintainer publishes it.
  publish:
    name: Create draft release
    needs: [build, checksums, attest, container]
    if: ${{ always() && needs.build.result == 'success' && needs.checksums.result == 'success' && needs.container.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # Nothing here changes an existing release, draft or published: a
      # draft could be published between a check and a delete. Delete a
      # stale draft by hand, then rerun.
      - name: Refuse to touch an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A failed lookup must not look like "no release exists".
          if ! listing=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"); then
            echo "::error::could not list the releases for $GITHUB_REF_NAME; refusing to publish unchecked"
            exit 1
          fi
          if [[ -n "$listing" ]]; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; delete it if it is a stale draft, then rerun"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          # Titled like Balun's and Tributary's releases ("Balun v0.1.0 Alpha").
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Switchworks v$VERSION Alpha" --notes-file notes/RELEASE_NOTES.md $prerelease
