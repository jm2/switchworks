name: CI
# Every action is pinned to a full commit SHA; Dependabot keeps the pins and
# their version comments current.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: make fmt-check

  vet:
    name: go vet (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Vet type-checks the test files too, so this also proves the tests
      # compile for every release target.
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The D-Bus and Linux tray tests run against a private dbus-daemon.
      - name: Install dbus-daemon
        if: runner.os == 'Linux'
        run: command -v dbus-daemon || { sudo apt-get update && sudo apt-get install -y dbus-daemon; }

      # Tests that need a real goose or codex binary skip themselves here.
      - name: Test
        run: go test -race -count=1 -fullpath ./...

  # The services for real, on each OS: coordinator and node registered
  # with the user's own service manager (systemd user units, LaunchAgents,
  # logon tasks), checked to run as this user and to connect, restarted,
  # stopped and removed. Then the tray starts and stays up.
  service-smoke:
    name: Services (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = Windows ]; then
            go build -o bin/swyd.exe ./cmd/swyd
            go build -ldflags -H=windowsgui -o bin/swydw.exe ./cmd/swyd
            go build -ldflags -H=windowsgui -o bin/swyd-tray.exe ./cmd/swyd-tray
          else
            go build -o bin/swyd ./cmd/swyd
          fi

      - name: Coordinator and node as user services
        shell: bash
        run: |
          exe=swyd
          [ "$RUNNER_OS" = Windows ] && exe=swyd.exe
          bash build-aux/ci/service-smoke.sh "$PWD/bin/$exe"

      - name: Windows tray starts and stays up
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process bin\swyd-tray.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "swyd-tray exited with $($p.ExitCode)" }
          # A second copy in the same session exits at once.
          $q = Start-Process bin\swyd-tray.exe -PassThru
          if (-not $q.WaitForExit(10000)) { Stop-Process -Id $q.Id; throw 'a second tray kept running' }
          if ($p.HasExited) { throw 'the first tray exited' }
          Stop-Process -Id $p.Id

  container-smoke:
    name: Container (rootless Podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Podman and pasta
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman passt
          # Ubuntu 24.04 limits unprivileged user namespaces, which rootless
          # Podman needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/swyd ./cmd/swyd

      - name: Coordinator image under Quadlet, with a node enrolled
        run: bash build-aux/ci/container-smoke.sh "$PWD/bin/swyd"

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build every release target
        run: make cross VERSION="ci-${GITHUB_SHA::12}"

      - name: Check the version is stamped into the binary
        run: |
          out=$(dist/swyd-linux-amd64 version)
          echo "$out"
          case "$out" in
            "swyd ci-${GITHUB_SHA::12} "*) ;;
            *) echo "::error::version was not stamped by -ldflags -X"; exit 1 ;;
          esac

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # govulncheck may need a newer Go than go.mod to build itself; GOTOOLCHAIN
      # fetches one just for the install. The scan itself runs with the go.mod
      # toolchain, so it reports the standard library the release ships with.
      - name: Install govulncheck
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan
        run: |
          go version
          "$(go env GOPATH)/bin/govulncheck" ./...

  # The .deb, checked with lintian, plus the packaging scripts and data files.
  package-deb:
    name: Package (.deb, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lintian desktop-file-utils shellcheck

      - name: Check scripts and data files
        run: |
          shellcheck build-aux/linux/*.sh build-aux/macos/*.sh build-aux/winget/*.sh
          desktop-file-validate data/io.github.jm2.Switchyard.desktop
          build-aux/winget/render.sh 0.0.0 "$(printf '0%.0s' {1..64})" "$RUNNER_TEMP/winget"

      - name: Build and lint the .deb
        run: |
          make cross VERSION="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
          make deb ARCH=amd64 VERSION="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
          lintian --fail-on error,warning dist/switchyard-amd64.deb
          sudo apt-get install -y ./dist/switchyard-amd64.deb
          swyd version
          systemd-analyze verify /usr/lib/systemd/user/swyd-node.service /usr/lib/systemd/user/swyd-coordinator.service
          test -z "$(dpkg-deb --ctrl-tarfile dist/switchyard-amd64.deb | tar -t | grep -E 'postinst|preinst|prerm|postrm' || true)"

  # The same spec COPR builds.
  package-rpm:
    name: Package (.rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False git-core golang make rpm-build systemd-rpm-macros desktop-file-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the .rpm
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          top="$PWD/rpmbuild"
          mkdir -p "$top/SOURCES"
          version=$(sed -n 's/^Version: *//p' build-aux/rpm/switchyard.spec)
          git archive --format=tar.gz --prefix="switchyard-$version/" -o "$top/SOURCES/v$version.tar.gz" HEAD
          rpmbuild --define "_topdir $top" -bb build-aux/rpm/switchyard.spec
          rpm -qlp "$top"/RPMS/*/*.rpm
          test -z "$(rpm -qp --scripts "$top"/RPMS/*/*.rpm)"

  package-arch:
    name: Package (Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git go

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package
        run: |
          useradd -m builder
          cp -r . /home/builder/switchyard
          cp build-aux/arch/PKGBUILD /home/builder/switchyard/PKGBUILD
          chown -R builder:builder /home/builder/switchyard
          su builder -c "cd /home/builder/switchyard && SWYD_VERSION=v0.0.0-ci makepkg -f --noconfirm"
          bsdtar -tf /home/builder/switchyard/switchyard-*.pkg.tar.zst

  # Builds the installer, installs it for the current user without elevation,
  # registers and removes the node's logon task, and uninstalls.
  package-windows:
    name: Package (Windows installer)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build swyd.exe, swydw.exe and swyd-tray.exe
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $ld = '-s -w -X github.com/jm2/switchyard/internal/version.Version=v0.0.0-ci'
          go build -trimpath -ldflags "$ld" -o dist\windows-amd64\swyd.exe .\cmd\swyd
          go build -trimpath -ldflags "$ld -H=windowsgui" -o dist\windows-amd64\swydw.exe .\cmd\swyd
          go build -trimpath -ldflags "$ld -H=windowsgui" -o dist\windows-amd64\swyd-tray.exe .\cmd\swyd-tray

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 --allow-downgrade -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the installer
        shell: pwsh
        run: |
          iscc /Qp /DAppVersion=0.0.0-ci /DAppNumericVersion=0.0.0.0 "/DSourceDir=$PWD\dist\windows-amd64" "/DOutputDir=$PWD\out" build-aux\inno\switchyard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, register the logon task, uninstall
        shell: pwsh
        run: |
          $setup = Start-Process out\switchyard-windows-x86_64-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=addtopath', '/ALLOWELEVATED=1'
          if ($setup.ExitCode -ne 0) { throw "setup exited $($setup.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Switchyard'
          $swyd = Join-Path $app 'swyd.exe'
          & $swyd version
          & $swyd service install --no-start node
          if ($LASTEXITCODE -ne 0) { throw 'service install failed' }
          # "Switchyard node (<user>, <SID>)"
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $task = "Switchyard node ($env:USERNAME, $sid)"
          $t = Get-ScheduledTask -TaskName $task
          $t.Principal | Format-List
          if ($t.Principal.RunLevel -ne 'Limited') { throw "task runs elevated: $($t.Principal.RunLevel)" }
          if ($t.Actions[0].Execute -notlike '*\swydw.exe') { throw "task runs $($t.Actions[0].Execute)" }
          & $swyd service status node
          & $swyd service uninstall node
          if (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue) { throw 'task still registered' }
          $un = Start-Process (Join-Path $app 'unins000.exe') -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($un.ExitCode -ne 0) { throw "uninstall exited $($un.ExitCode)" }

  # Compiles the Swift menu-bar app and packs the .dmg (ad-hoc signed).
  package-macos:
    name: Package (macOS app)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Switchyard.app and the .dmg
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/jm2/switchyard/internal/version.Version=v0.0.0-ci" -o dist/swyd ./cmd/swyd
          bash build-aux/macos/build-dmg.sh v0.0.0-ci dist/swyd out
          hdiutil attach -nobrowse -mountpoint /tmp/swyd-dmg out/switchyard-macos-aarch64.dmg
          /tmp/swyd-dmg/Switchyard.app/Contents/MacOS/swyd service status --json
          test "$(plutil -extract LSUIElement raw -o - /tmp/swyd-dmg/Switchyard.app/Contents/Info.plist)" = true
          # The menu-bar app starts (no Dock icon) and stays up.
          cp -R /tmp/swyd-dmg/Switchyard.app /Applications/
          open -g /Applications/Switchyard.app
          sleep 5
          pgrep -x Switchyard
          osascript -e 'quit app "Switchyard"' || pkill -x Switchyard
          hdiutil detach /tmp/swyd-dmg
